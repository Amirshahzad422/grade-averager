<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade Averager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Course Grade Averager</h1>          <!-- CONFLICT ZONE 1 -->
    <p class="lead">Paste scores separated by commas or spaces, then get the mean.</p>
    <label for="grades">Grades</label>
    <input id="grades" type="text" inputmode="decimal" placeholder="e.g. 88, 74, 91, 80" autocomplete="off">
    <button type="button" id="avg-btn">Compute My Average</button>  <!-- CONFLICT ZONE 2 -->
    <p id="result" class="result" aria-live="polite"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
